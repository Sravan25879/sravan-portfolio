# Render Infrastructure as Code Blueprint — Pure Static Site
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sravan-portfolio
    env: static
    buildCommand: echo "Pure static build ready"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
